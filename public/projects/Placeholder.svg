<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F2F2F2"/>
    </linearGradient>

    <!-- Diagonal grid pattern, very low opacity -->
    <pattern id="diagGrid" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#D1D5DB" stroke-width="1" opacity="0.35"/>
    </pattern>

    <!-- Vignette to fade grid slightly at edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Card glass shadow -->
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#9CA3AF" flood-opacity="0.28"/>
    </filter>

    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9CA3AF" flood-opacity="0.30"/>
    </filter>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>

    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEEF0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#diagGrid)"/>
  <rect width="1280" height="720" fill="url(#vignette)"/>

  <!-- Outer thin rounded border -->
  <rect x="1.5" y="1.5" width="1277" height="717" rx="20" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="11.5" y="11.5" width="1257" height="697" rx="16" fill="none" stroke="#EDEEF0" stroke-width="1"/>

  <!-- Center icon composition -->
  <g filter="url(#cardShadow)">

    <!-- Folder icon (back, upper-left of group) -->
    <g transform="translate(478, 256)" filter="url(#iconShadow)">
      <path d="M0 14 C0 8.5 4.5 4 10 4 H34 L46 16 H108 C113.5 16 118 20.5 118 26 V78 C118 83.5 113.5 88 108 88 H10 C4.5 88 0 83.5 0 78 Z"
            fill="url(#glassGrad)" stroke="#D1D5DB" stroke-width="2"/>
      <path d="M0 30 H118" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Monitor icon (main, centered) -->
    <g transform="translate(430, 210)">
      <rect x="0" y="0" width="220" height="150" rx="16" fill="url(#monitorGrad)" stroke="#D1D5DB" stroke-width="2.5"/>
      <rect x="14" y="14" width="192" height="122" rx="8" fill="#FCFCFD" stroke="#E5E7EB" stroke-width="1.5"/>

      <!-- Image placeholder icon inside screen -->
      <g transform="translate(78, 46)">
        <rect x="0" y="0" width="64" height="58" rx="8" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
        <circle cx="16" cy="17" r="6" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
        <path d="M4 46 L22 30 L34 40 L46 24 L60 46" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Monitor stand -->
      <rect x="98" y="150" width="24" height="20" rx="3" fill="#EDEEF0" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="70" y="170" width="80" height="10" rx="4" fill="#EDEEF0" stroke="#D1D5DB" stroke-width="2"/>
    </g>
  </g>

  <!-- Text block -->
  <text x="640" y="452" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#374151" letter-spacing="0.5">
    Project Preview
  </text>
  <!-- Thin decorative divider -->
  <rect x="600" y="480" width="80" height="2" rx="1" fill="#E5E7EB"/>

  <!-- Tiny footer text -->
  <text x="640" y="672" text-anchor="middle" font-family="-apple-system, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" letter-spacing="1.2">
    ACHMAD SYAHRIL FAUZI PORTFOLIO
  </text>
</svg>
